name: iOS — verificação manual no Mac

# This file is delivered locally. No workflow is dispatched by these scripts.
# Upload the repository and run it only after the owner's authorization.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Xcode instalado
        run: xcodebuild -version
      - name: Core, app, integração Apple e interface
        run: bash iOS/scripts/test-macos.sh
      - name: Resultados sintéticos do Xcode
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ninho-ios-xcresults
          path: iOS/TestResults/*.xcresult
          if-no-files-found: warn
          retention-days: 7
